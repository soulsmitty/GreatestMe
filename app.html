<title>GreatestMe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Protocol / Pocketbook theme suite: cool canvas, white cards, hairlines, mono eyebrows, slashed-zero figures.
   Layout: left rail on iPad/Mac, bottom tabs on iPhone; one working column. Accent is per person (--acc / --acc2). */
:root{
  --canvas:#F2F4F7; --surface:#FFFFFF; --raised:#F8F9FB; --line:#E8EBF0; --ink:#0F1420; --muted:#6C7688; --faint:#949EB0;
  --acc:#8B5CF6; --acc2:#F59E0B; --good:#10B981; --bad:#F43F5E;
  --acc-soft:color-mix(in srgb,var(--acc) 12%,var(--surface)); --acc2-soft:color-mix(in srgb,var(--acc2) 14%,var(--surface)); --good-soft:color-mix(in srgb,var(--good) 14%,var(--surface));
  --on-acc:#FFFFFF;
  --shadow-card:0 1px 2px rgb(16 24 40 / .04),0 1px 3px rgb(16 24 40 / .06); --shadow-lift:0 4px 12px rgb(16 24 40 / .08),0 2px 4px rgb(16 24 40 / .04);
  --paper:#FFFFFF; --rule:#A9C6E8; --margin:#E8868B;
  --bg:var(--canvas); --violet:var(--acc); --violet-soft:var(--acc-soft); --ember:var(--acc2); --ember-soft:var(--acc2-soft); --warn:#F59E0B;
  --f-display:"Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:14px; --shadow:var(--shadow-lift);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#0B0E14; --surface:#141922; --raised:#1B212C; --line:#232A36; --ink:#E8ECF3; --muted:#8F9AAD; --faint:#6E798C;
  --shadow-card:0 1px 2px rgb(0 0 0 / .3),0 1px 3px rgb(0 0 0 / .2); --shadow-lift:0 4px 14px rgb(0 0 0 / .4),0 2px 6px rgb(0 0 0 / .25);
  --paper:#F7F5EF; --rule:#9DB8DA; --margin:#E07A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#0B0E14; --surface:#141922; --raised:#1B212C; --line:#232A36; --ink:#E8ECF3; --muted:#8F9AAD; --faint:#6E798C;
  --shadow-card:0 1px 2px rgb(0 0 0 / .3),0 1px 3px rgb(0 0 0 / .2); --shadow-lift:0 4px 14px rgb(0 0 0 / .4),0 2px 6px rgb(0 0 0 / .25);
  --paper:#F7F5EF; --rule:#9DB8DA; --margin:#E07A80; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--canvas);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(1.55rem,4vw,1.85rem);font-weight:800}
h2{font-size:1.08rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px} /* 16px stops iOS Safari from zooming the page on focus */
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.mono{font-family:var(--f-mono);font-variant-numeric:slashed-zero tabular-nums}
.label{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);font-weight:500;line-height:1.4}
.muted{color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;height:100dvh;padding:24px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;background:var(--surface)}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;padding:0 10px;letter-spacing:-.02em}
.brand b{color:var(--ember)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-weight:500;color:var(--muted)}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--violet-soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--violet-soft);color:var(--violet);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--violet)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.main{min-width:0;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabs{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .tabs{display:grid;grid-template-columns:repeat(var(--tabs,6),1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--muted);padding:4px 0;border-radius:8px}
  .tabs button svg{width:20px;height:20px}
  .tabs button[aria-current="page"]{color:var(--violet);font-weight:600}
  .main{padding-block:16px 110px}
  .mtop{display:flex!important}
}
.mtop{display:none;justify-content:space-between;align-items:center}

/* page head */
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head .sub{color:var(--muted);margin-top:4px}
.daynav{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--violet-soft);color:var(--violet);font-size:.78rem;font-weight:600}
.chip.ember{background:var(--ember-soft);color:var(--ember)}
.chip.good{background:var(--good-soft);color:var(--good)}

/* cards */
.card{background:var(--surface);box-shadow:var(--shadow-card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.quote{border-left:3px solid var(--ember);padding:4px 0 4px 14px;font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.quote cite{display:block;font-family:var(--f-body);font-style:normal;font-size:.8rem;color:var(--muted);margin-top:4px}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.in,textarea.in,select.in{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 2px;border-radius:0;outline:none}
.in:focus{border-bottom-color:var(--violet)}
textarea.in{resize:vertical;min-height:72px;border:1px solid var(--line);border-radius:10px;padding:10px}
textarea.in:focus{border-color:var(--violet)}
select.in{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:var(--surface)}
.box{border:1px solid var(--line)!important;border-radius:10px!important;padding:10px 12px!important}
.num-rows{display:flex;flex-direction:column;gap:2px}
.num-row{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:8px}
.num-row .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.target{display:grid;grid-template-columns:26px 1fr minmax(0,150px);gap:8px;align-items:center}
@media (max-width:520px){.target{grid-template-columns:26px 1fr}.target select{grid-column:2}}
.check{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;cursor:pointer;display:grid;place-items:center;margin:0;background:var(--surface)}
.check:checked{background:var(--good);border-color:var(--good)}
.check:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done-text{text-decoration:line-through;color:var(--muted)}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--violet)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.ember{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn.icon{padding:6px;width:34px;height:34px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{cursor:pointer;min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-weight:600}
.scale button[aria-pressed="true"]{background:var(--violet);color:var(--surface);border-color:var(--violet)}

/* meters */
.bar{height:8px;background:var(--violet-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet);border-radius:99px;transition:width .3s}
.bar.ember i{background:var(--ember)}
.bar.good i{background:var(--good)}
.stat{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1}
.stat .v small{font-size:.9rem;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}

/* journey strip: 13 weeks */
.strip{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.strip span{height:10px;border-radius:3px;background:var(--line)}
.strip span.past{background:var(--violet)}
.strip span.now{background:var(--ember)}

/* habit grids */
.hgrid{overflow-x:auto}
.hgrid table{border-collapse:separate;border-spacing:4px;min-width:100%}
.hgrid th{font-size:.72rem;color:var(--muted);font-weight:600;text-align:center;padding:0 2px}
.hgrid th.hn{text-align:left;font-size:.88rem;color:var(--ink);font-weight:500;min-width:120px}
.hgrid td{text-align:center}
.cell{cursor:pointer;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.cell[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.cell:disabled{opacity:.35;cursor:default}
.heat{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;max-width:420px}
.heat .wk{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--line);max-width:100%}
.heat i.on{background:var(--good)}
.heat i.future{background:transparent;border:1px dashed var(--line)}

.goal{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.goal-n{font-family:var(--f-mono);font-size:.75rem;color:var(--ember);font-weight:600}
.ms{display:grid;grid-template-columns:26px 1fr 92px 34px;gap:8px;align-items:center}
@media (max-width:520px){.ms{grid-template-columns:26px 1fr 80px 34px}}

details.sched summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.sched summary::-webkit-details-marker{display:none}
.sched-grid{display:grid;grid-template-columns:62px 1fr;gap:0 10px;margin-top:10px}
.sched-grid .t{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);padding-top:9px}

.spark{width:100%;height:120px;display:block}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.partner{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--ember-soft);color:var(--ember);font-size:1.2rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;z-index:50;font-size:.9rem}
.save{font-size:.75rem;color:var(--muted)}

/* auth / onboarding */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate-card{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.gate-brand{font-family:var(--f-display);font-weight:800;font-size:2.4rem;letter-spacing:-.03em;line-height:1}
.gate-brand b{color:var(--ember)}
.seg{display:flex;background:var(--violet-soft);border-radius:10px;padding:3px}
.seg button{flex:1;all:unset;text-align:center;cursor:pointer;padding:7px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.err{color:var(--ember);font-size:.88rem}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--violet)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem}
.presets button[aria-pressed="true"]{background:var(--violet);color:var(--surface);border-color:var(--violet)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,6,20,.5);z-index:40;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
/* Protocol / Pocketbook details */
.card{border-radius:var(--r)}
.chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.stat .v,.mono,.v small{font-variant-numeric:slashed-zero tabular-nums}
.stat .v{font-family:var(--f-mono);font-weight:600;letter-spacing:-.02em}
.title-bar{display:flex;align-items:center;gap:10px}
.title-bar::before{content:"";width:6px;height:24px;border-radius:999px;background:var(--acc);flex:none}
.save{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.toggle3{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);box-shadow:var(--shadow-card)}
.toggle3 button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:999px;color:var(--muted)}
.toggle3 button[aria-pressed="true"]{background:var(--ink);color:var(--canvas)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.linkrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.linkrow code{font-family:var(--f-mono);font-size:.78rem;overflow-wrap:anywhere;color:var(--muted)}
body.kb .tabs{display:none}
/* Ink (iPad + Apple Pencil) */
.ink-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-card)}
.ink-bar .grp{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}
.ink-bar .grp:last-child{border-right:0}
.ink-bar button.t{cursor:pointer;min-width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted)}
.ink-bar button.t[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 30%,transparent)}
.ink-bar .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.ink-bar button.t[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--ink)}
.ink-pages{display:flex;flex-direction:column;gap:18px}
.ink-page{position:relative;background:var(--paper);border-radius:6px;box-shadow:var(--shadow-lift);overflow:hidden;max-width:100%}
.ink-page canvas{display:block;width:100%;touch-action:pan-y pinch-zoom;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ink-page.finger canvas{touch-action:none}
.ink-page .pg{position:absolute;right:12px;bottom:8px;font-family:var(--f-mono);font-size:10px;color:#8A8F99}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="root"><div class="loading"><div style="text-align:center"><div class="gate-brand">Greatest<b>Me</b></div><p style="margin-top:10px">Opening your journal…</p></div></div></div>

<script>
(() => {
"use strict";
/* ============================ utilities ============================ */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const diffDays = (a, b) => Math.round((Date.UTC(...ymd(b)) - Date.UTC(...ymd(a))) / 864e5);

const today = () => iso(new Date());
const fmtDate = (s, o = {weekday:"long", month:"long", day:"numeric"}) => parse(s).toLocaleDateString(undefined, o);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const getPath = (o, p) => p.split(".").reduce((a, k) => a == null ? a : a[k], o);
const setPath = (o, p, v) => { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach((k, i) => { if (a[k] == null || typeof a[k] !== "object") a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[k]; }); a[ks.at(-1)] = v; };
const ls = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }, del(k){ try { localStorage.removeItem(k); } catch {} } };
const TOTAL_DAYS = 91, WEEKS = 13;

const ICON = {
  ink:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>',
  hl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l-4 4h5l2-2M9 15l7-7 3 3-7 7z"/></svg>',
  eraser:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9l-5-5 10-10 7 7-7 7"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',

const Store = {
  mode: "local", uid: null, docs: {}, col: null, db: null, accountName: "", dirty: new Map(), writing: new Set(), timer: null, status: "saved",
  async loadAll(){
    if (this.mode === "cloud") {
      const snap = await this.col.limit(1000).get();
      const out = {}; snap.docs.forEach(d => { if (d.exists) out[d.id] = d.data(); });
      this.docs = out;

/* local accounts */
async function hashPass(salt, pass){
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + "|" + pass));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  } catch {
    let h = 2166136261; for (const c of salt + "|" + pass) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return "f" + (h >>> 0).toString(16);
  }
}
const Accounts = {
  list(){ return ls.get("gm:accounts") || []; },
  save(a){ ls.set("gm:accounts", a); },
  async create(name, pass){
    name = name.trim(); if (name.length < 2) throw new Error("Use at least 2 characters for your name.");
    if (pass.length < 4) throw new Error("Use a passcode of at least 4 characters.");
    const all = this.list(); if (all.some(a => a.name.toLowerCase() === name.toLowerCase())) throw new Error("That name already has an account on this device. Sign in instead.");
    const salt = uid(); const acct = { id: "u" + uid(), name, salt, hash: await hashPass(salt, pass), created: Date.now() };
    all.push(acct); if (!this.save(all) && !ls.get("gm:accounts")) throw new Error("This browser is blocking storage, so an account can't be saved here.");
    return acct;
  },
  async signIn(name, pass){
    const a = this.list().find(x => x.name.toLowerCase() === name.trim().toLowerCase());
    if (!a || a.hash !== await hashPass(a.salt, pass)) throw new Error("Name or passcode doesn't match.");
    return a;
  },
};

const NAV = [["today","Today"],["week","Week"],["goals","Goals"],["habits","Habits"],["progress","Progress"],["duo","Duo"]];

function render(){
  const root = $("#root");

  if (S.view === "ink" && !canInk()) S.view = "today";
  applyAccent();
  const v = { today: todayView, ink: inkView, week: weekView, goals: goalsView, habits: habitsView, progress: progressView, duo: duoView }[S.view]();
  const items = navItems(); const nav = () => items.map(([k, l]) => `<button data-act="nav" data-v="${k}" ${S.view === k ? 'aria-current="page"' : ""}>${ICON[k]}<span>${l}</span></button>`).join("");
  const p = profile();
  root.innerHTML = `<div class="app">
    <aside class="rail"><div class="brand">Greatest<b>Me</b></div><nav class="nav">${nav()}</nav>
      <div class="rail-foot"><div class="label">${esc(p.nick || "")}</div><div id="savestate" class="save"></div>
      <button class="btn sm" data-act="sheet" data-v="settings">${ICON.gear.replace("<svg", '<svg width="16" height="16"')} Account & journeys</button></div></aside>
    <main class="main"><div class="col">
      <div class="mtop"><div class="brand" style="padding:0">Greatest<b>Me</b></div><button class="btn icon ghost" aria-label="Account and journeys" data-act="sheet" data-v="settings">${ICON.gear}</button></div>
      ${v}
    </div></main>
    <nav class="tabs" style="--tabs:${items.length}">${nav()}</nav>
  </div>${S.sheet ? sheetView() : ""}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ""}`;
  Store.setStatus(Store.status);

}
function toast(msg){ S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 2200); }

const bind = (key, path, extra = "") => `data-doc="${esc(key)}" data-f="${esc(path)}" ${extra}`;
const inp = (id, key, path, val, ph, cls = "in") => `<input id="${id}" class="${cls}" ${bind(key, path)} value="${esc(val)}" placeholder="${esc(ph)}" autocomplete="off">`;
const ta = (id, key, path, val, ph) => `<textarea id="${id}" class="in" ${bind(key, path)} placeholder="${esc(ph)}">${esc(val)}</textarea>`;
const goalOpts = (sel) => `<option value="">No goal</option>` + J().goals.map((g, i) => `<option value="${esc(g.id)}" ${sel === g.id ? "selected" : ""}>Goal ${i + 1}: ${esc(g.title.slice(0, 28))}</option>`).join("");
const scaleBtns = (key, path, val, n, labels) => `<div class="scale" role="group">${Array.from({ length: n }, (_, i) => `<button data-act="scale" data-doc="${esc(key)}" data-f="${esc(path)}" data-n="${i + 1}" aria-pressed="${val === i + 1}" title="${esc(labels ? labels[i] : i + 1)}">${i + 1}</button>`).join("")}</div>`;
const bar = (pct, cls = "") => `<div class="bar ${cls}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${clamp(pct, 0, 100)}%"></i></div>`;

function strip(j){ const w = weekOf(today(), j); const started = dayNum(today(), j) >= 1; return `<div class="strip" aria-label="13-week journey">${Array.from({ length: WEEKS }, (_, i) => `<span class="${started && i + 1 < w ? "past" : started && i + 1 === w ? "now" : ""}" title="Week ${i + 1}"></span>`).join("")}</div>`; }

/* ---------- Today ---------- */

/* ---------- Week ---------- */

  const due = j.goals.flatMap((g, gi) => g.milestones.filter(m => +m.week === w).map(m => ({ g, gi, m })));
  const t = today();
  return `
  <div class="head"><div><span class="chip ember">Week ${w} of ${WEEKS}</span><h1 style="margin-top:8px">${esc(fmtDate(days[0], { month: "short", day: "numeric" }))} – ${esc(fmtDate(days[6], { month: "short", day: "numeric" }))}</h1></div>
    <div class="daynav"><button class="btn icon" aria-label="Previous week" data-act="week" data-n="-1" ${w <= 1 ? "disabled" : ""}>${ICON.left}</button>

    <button class="btn icon" aria-label="Next week" data-act="week" data-n="1" ${w >= WEEKS ? "disabled" : ""}>${ICON.right}</button></div></div>
  ${strip(j)}

/* ---------- Progress ---------- */
function spark(vals, color){
  const W = 600, H = 120, P = 12; const n = Math.max(vals.length, 2);
  const x = i => P + i * (W - 2 * P) / (TOTAL_DAYS - 1), y = v => H - P - (v - 1) * (H - 2 * P) / 4;
  let path = "", started = false; const dots = [];
  vals.forEach((v, i) => { if (v == null) { started = false; return; } path += `${started ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)} `; started = true; dots.push([x(i), y(v)]); });
  const grid = [1, 3, 5].map(v => `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P}" y="${y(v) - 3}" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${v}</text>`).join("");
  const last = dots.at(-1);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily rating over the journey">${grid}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${last ? `<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${color}"/>` : ""}</svg>`;
}

function gateView(){
  const g = S.gate; const accts = Accounts.list();
  return `<div class="gate"><form class="gate-card" id="gateForm" novalidate>
    <div><div class="gate-brand">Greatest<b>Me</b></div><p class="muted" style="margin-top:8px">A 13-week journal for goals, habits and daily wins.</p></div>
    <div class="seg"><button type="button" data-act="gmode" data-v="signin" aria-pressed="${g.mode === "signin"}">Sign in</button><button type="button" data-act="gmode" data-v="create" aria-pressed="${g.mode === "create"}">Create account</button></div>
    ${g.mode === "signin" && accts.length ? `<div class="presets">${accts.map(a => `<button type="button" data-act="pickAcct" data-v="${esc(a.name)}" aria-pressed="${g.name === a.name}">${esc(a.name)}</button>`).join("")}</div>` : ""}
    <div class="field"><label class="label" for="gname">Your name</label><input id="gname" class="in box" value="${esc(g.name || "")}" autocomplete="username" required></div>
    <div class="field"><label class="label" for="gpass">Passcode</label><input id="gpass" type="password" class="in box" autocomplete="${g.mode === "create" ? "new-password" : "current-password"}" required></div>
    ${g.mode === "create" ? `<div class="field"><label class="label" for="gpass2">Confirm passcode</label><input id="gpass2" type="password" class="in box" autocomplete="new-password"></div>` : ""}
    ${g.err ? `<p class="err" role="alert">${esc(g.err)}</p>` : ""}
    <button class="btn primary" type="submit">${g.mode === "create" ? "Create my account" : "Sign in"}</button>
    <p class="muted" style="font-size:.8rem">Accounts on this device keep separate, passcode-protected journals. Open GreatestMe in Claude to sync across devices with your Claude account.</p>
  </form></div>`;
}

/* ---------- Onboarding ---------- */
function onboardView(){
  const o = S.onboard || (S.onboard = { step: 1, nick: Store.accountName || "", start: today(), goals: [{ title: "", why: "", measure: "" }, { title: "", why: "", measure: "" }, { title: "", why: "", measure: "" }], habits: [] });
  const steps = `<div class="steps">${[1, 2, 3].map(i => `<i class="${i <= o.step ? "on" : ""}"></i>`).join("")}</div>`;
  let body = "";
  if (o.step === 1) body = `<h2>Let's set up your journal</h2>
    <div class="field"><label class="label" for="onick">What should we call you?</label><input id="onick" class="in box" value="${esc(o.nick)}" autocomplete="off" placeholder="Your first name"></div>
    <div class="field"><label class="label" for="ostart">Day 1 of your 13 weeks</label><input id="ostart" type="date" class="in box" value="${esc(o.start)}"><div class="row"><button type="button" class="btn sm" data-act="ostart" data-v="${today()}">Today</button><button type="button" class="btn sm" data-act="ostart" data-v="${nextMonday()}">Next Monday</button></div></div>`;
  if (o.step === 2) body = `<h2>Your 13-week goals</h2><p class="muted">One to three. Make each specific enough that you'd know on day 91 whether you hit it.</p>
    ${o.goals.map((g, i) => `<div class="field"><label class="label" for="og${i}">Goal ${i + 1}${i ? " (optional)" : ""}</label><input id="og${i}" class="in box" data-og="${i}" value="${esc(g.title)}" placeholder="${["Save $5,000 for the emergency fund","Run a sub-25 5K","Launch the first product"][i]}" autocomplete="off"></div>`).join("")}`;
  if (o.step === 3) body = `<h2>Daily habits</h2><p class="muted">Pick the few that make everything else easier. You can change these later.</p>
    <div class="presets">${HABIT_PRESETS.map(p => `<button type="button" data-act="oh" data-v="${esc(p)}" aria-pressed="${o.habits.includes(p)}">${esc(p)}</button>`).join("")}</div>
    <div class="row" style="flex-wrap:nowrap"><input id="ohnew" class="in box" placeholder="Your own habit" autocomplete="off"><button type="button" class="btn sm" data-act="ohadd">Add</button></div>
    ${o.habits.filter(h => !HABIT_PRESETS.includes(h)).map(h => `<span class="chip">${esc(h)}</span>`).join(" ")}`;
  return `<div class="gate"><div class="gate-card"><div class="gate-brand">Greatest<b>Me</b></div>${steps}${body}
    ${S.onboardErr ? `<p class="err" role="alert">${esc(S.onboardErr)}</p>` : ""}
    <div class="row" style="justify-content:space-between">${o.step > 1 ? `<button class="btn" data-act="oback">Back</button>` : "<span></span>"}<button class="btn primary" data-act="onext">${o.step < 3 ? "Continue" : "Open my journal"}</button></div></div></div>`;
}
function captureOnboard(){
  const o = S.onboard; if (!o) return;
  const n = $("#onick"); if (n) o.nick = n.value; const s = $("#ostart"); if (s && s.value) o.start = s.value;
  document.querySelectorAll("[data-og]").forEach(el => { o.goals[+el.dataset.og].title = el.value; });
}

/* ============================ events ============================ */
function onInput(e){
  const el = e.target; if (!el.dataset || !el.dataset.doc) return;
  const key = el.dataset.doc, f = el.dataset.f; const doc = Store.get(key); if (!doc) return;
  let v = el.type === "checkbox" ? el.checked : el.value; if (el.dataset.num) v = +v;
  if (key.startsWith("journey-") && f === "start" && !v) return;
  setPath(doc, f, v); Store.touch(key);
  if (el.type === "checkbox" || el.tagName === "SELECT" || el.type === "date") render();
}
async function onClick(e){
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act; const j = J();
  if (a === "closebg" && e.target !== t) return;
  switch (a) {
    case "nav": S.view = t.dataset.v; if ((S.view === "today" || S.view === "ink") && !t.dataset.keepdate) S.date = today(); try { history.replaceState(null, "", "#" + S.view); } catch {} if (S.view === "week") S.week = null; window.scrollTo(0, 0); render(); window.scrollTo(0, 0); break;
    case "day": { const n = +t.dataset.n; S.date = n === 0 ? today() : addDays(S.date, n); render(); break; }
    case "week": { const n = +t.dataset.n; S.week = n === 0 ? weekOf(today()) : clamp((S.week || weekOf(today())) + n, 1, WEEKS); render(); break; }
    case "scale": { const doc = Store.get(t.dataset.doc); const n = +t.dataset.n; setPath(doc, t.dataset.f, getPath(doc, t.dataset.f) === n ? 0 : n); Store.touch(t.dataset.doc); render(); break; }
    case "addTarget": { const doc = Store.get(t.dataset.doc); doc.targets.push({ t: "", g: "", done: false }); Store.touch(t.dataset.doc); render(); break; }
    case "habit": { const k = dayKey(t.dataset.d); const dd = Store.ensure(k, newDay); dd.habits[t.dataset.h] = !dd.habits[t.dataset.h]; Store.touch(k); render(); break; }
    case "ms": { const g = j.goals.find(x => x.id === t.dataset.g); const m = g && g.milestones.find(x => x.id === t.dataset.m); if (m) { m.done = !m.done; Store.touch("journey-" + j.id); render(); } break; }
    case "addGoal": if (j.goals.length < 3) { j.goals.push({ id: uid(), title: "", why: "", measure: "", reward: "", milestones: [] }); Store.touch("journey-" + j.id); render(); const el = $(`#gt${j.goals.length - 1}`); el && el.focus(); } break;
    case "delGoal": if (t.dataset.confirm === "1") { j.goals = j.goals.filter(g => g.id !== t.dataset.g); Store.touch("journey-" + j.id); render(); } else { t.dataset.confirm = "1"; t.textContent = "Tap again to remove"; t.classList.add("ember"); } break;
    case "addMs": { const g = j.goals.find(x => x.id === t.dataset.g); const last = g.milestones.at(-1); g.milestones.push({ id: uid(), text: "", week: last ? Math.min(WEEKS, +last.week + 1) : weekOf(today()), done: false }); Store.touch("journey-" + j.id); render(); break; }
    case "seedMs": { const g = j.goals.find(x => x.id === t.dataset.g); [2, 4, 6, 8, 10, 12, 13].forEach((w, i) => g.milestones.push({ id: uid(), text: w === 13 ? "Goal achieved" : `Checkpoint ${i + 1}`, week: w, done: false })); Store.touch("journey-" + j.id); render(); break; }
    case "delMs": { const g = j.goals.find(x => x.id === t.dataset.g); g.milestones = g.milestones.filter(m => m.id !== t.dataset.m); Store.touch("journey-" + j.id); render(); break; }
    case "addHabit": addHabit($("#newHabit").value); break;
    case "presetHabit": addHabit(t.dataset.v); break;
    case "delHabit": if (t.dataset.confirm === "1") { j.habits = j.habits.filter(h => h.id !== t.dataset.h); Store.touch("journey-" + j.id); render(); } else { t.dataset.confirm = "1"; t.classList.add("ember"); t.setAttribute("aria-label", "Tap again to remove"); t.title = "Tap again to remove"; } break;
    case "toggleShare": { const p = profile(); p.share = !p.share; Store.touch("profile"); render(); Duo.publish(); toast(p.share ? "Sharing turned on" : "Sharing turned off"); break; }
    case "cheer": { const p = profile(); p.cheers = p.cheers || {}; p.cheers[t.dataset.id] = Date.now(); Store.touch("profile"); await Duo.publish(); toast("Cheer sent"); break; }
    case "sheet": S.sheet = t.dataset.v; render(); break;
    case "close": case "closebg": S.sheet = null; render(); break;
    case "switchJ": profile().active = t.dataset.id; Store.touch("profile"); S.sheet = null; S.date = today(); S.week = null; render(); break;
    case "createJourney": { const start = $("#njs").value || nextMonday(); const nj = createJourney({ title: $("#njt").value.trim() || "Journey", start, goals: [], habits: j.habits.map(h => h.name) }); profile().active = nj.id; Store.touch("profile"); S.sheet = null; S.view = "goals"; render(); toast("New journey created. Set your goals."); break; }
    case "export": doExport(); break;
    case "theme": Theme.set(t.dataset.v); render(); break;
    case "accent": profile().accent = t.dataset.v; Store.touch("profile"); render(); break;
    case "inkPref": profile().ink = t.dataset.v === "auto" ? undefined : t.dataset.v; if (t.dataset.v === "auto") delete profile().ink; Store.touch("profile"); render(); break;
    case "copy": { const v = t.dataset.v; try { await navigator.clipboard.writeText(v); toast("Link copied"); } catch { const r = document.createRange(); const code = t.parentElement.querySelector("code"); if (code) { r.selectNodeContents(code); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("Link selected. Tap Copy."); } break; }
    case "inkTool": Ink.tool = t.dataset.v; render(); break;
    case "inkColor": Ink.color = t.dataset.v; Ink.tool = "pen"; render(); break;
    case "inkSize": Ink.size = +t.dataset.v; render(); break;
    case "inkFinger": Ink.finger = !Ink.finger; render(); break;
    case "inkUndo": Ink.step(Ink.undo, Ink.redo); break;
    case "inkRedo": Ink.step(Ink.redo, Ink.undo); break;
    case "inkAddPage": if (Ink.data) { Ink.data.pages.push([]); Ink.status = ""; Ink.queue(Ink.data.pages.length - 1); render(); setTimeout(() => { const pg = document.querySelectorAll(".ink-page"); pg[pg.length - 1]?.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50); } break;
    case "inkClear": if (Ink.data) { if (t.dataset.confirm === "1") { const i = Ink.data.pages.length - 1; Ink.snapshot(i); Ink.data.pages[i] = []; Ink.queue(i); render(); } else { t.dataset.confirm = "1"; t.textContent = "Tap again to clear"; t.classList.add("ember"); } } break;
    case "signout": await Store.flush(); ls.del("gm:session"); location.reload(); break;
    case "gmode": S.gate.mode = t.dataset.v; S.gate.err = ""; render(); break;
    case "pickAcct": S.gate.name = t.dataset.v; render(); $("#gpass").focus(); break;
    case "ostart": $("#ostart").value = t.dataset.v; break;
    case "oh": { captureOnboard(); const o = S.onboard; const v = t.dataset.v; o.habits = o.habits.includes(v) ? o.habits.filter(x => x !== v) : o.habits.concat(v).slice(0, 8); render(); break; }
    case "ohadd": { const v = $("#ohnew").value.trim(); if (v && !S.onboard.habits.includes(v)) S.onboard.habits.push(v); render(); break; }
    case "oback": captureOnboard(); S.onboard.step--; S.onboardErr = ""; render(); break;
    case "onext": {
      captureOnboard(); const o = S.onboard; S.onboardErr = "";
      if (o.step === 1 && !o.nick.trim()) { S.onboardErr = "Add a name so your journal knows who it belongs to."; render(); break; }
      if (o.step === 2 && !o.goals.some(g => g.title.trim())) { S.onboardErr = "Add at least one goal. You can refine it later."; render(); break; }
      if (o.step < 3) { o.step++; render(); break; }
      const jn = createJourney({ title: "Journey 1", start: o.start, goals: o.goals, habits: o.habits });
      Store.docs.profile = { nick: o.nick.trim(), active: jn.id, created: Date.now(), share: false, cheers: {} }; Store.touch("profile");
      S.onboard = null; S.view = "today"; S.date = today(); render(); toast("Your journal is ready"); break;
    }
  }
}
function addHabit(name){ const j = J(); name = (name || "").trim(); if (!name || j.habits.length >= 8) return; j.habits.push({ id: uid(), name }); Store.touch("journey-" + j.id); render(); const n = $("#newHabit"); n && n.focus(); }

async function doExport(){
  await Store.flush();
  const data = JSON.stringify({ app: "GreatestMe", version: 1, exported: new Date().toISOString(), docs: Store.docs }, null, 2);
  const name = `greatestme-backup-${today()}.json`;
  try {
    const dl = window.claude && window.claude.use ? await claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: name, data }); toast("Backup ready"); return; }
  } catch (e) { if (e && e.code && e.code !== "unavailable") { toast("Backup cancelled"); return; } }
  const showText = () => { const out = $("#exportOut"); if (out) out.innerHTML = `<p class="muted" style="font-size:.8rem">Copy this text and keep it somewhere safe.</p><textarea class="in" readonly style="min-height:120px">${esc(data)}</textarea>`; };
  if (window.claude) return showText();
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast("Backup downloaded"); }
  catch { const out = $("#exportOut"); if (out) { out.innerHTML = `<textarea class="in" readonly style="min-height:120px">${esc(data)}</textarea>`; } }
}
async function doImport(file){
  try {
    const obj = JSON.parse(await file.text()); if (!obj || obj.app !== "GreatestMe" || !obj.docs || typeof obj.docs !== "object") throw 0;
    Object.entries(obj.docs).forEach(([k, v]) => { if (/^(profile|journey-[\w-]+|day-[\w-]+|week-[\w-]+)$/.test(k) && v && typeof v === "object") { Store.docs[k] = v; Store.dirty.set(k, true); } });
    await Store.flush(); S.sheet = null; render(); toast("Backup imported");
  } catch { toast("That file isn't a GreatestMe backup"); }
}

document.addEventListener("input", onInput);
document.addEventListener("change", e => { if (e.target.id === "inkTpl" && Ink.data) { Ink.data.meta.tpl = e.target.value; profile().inkTpl = e.target.value; Store.touch("profile"); Ink.queue(0); render(); return; } if (e.target.id === "importFile" && e.target.files[0]) doImport(e.target.files[0]); else if (e.target.type === "checkbox" || e.target.tagName === "SELECT" || e.target.type === "date") { /* handled by input */ } });
document.addEventListener("click", onClick);
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "newHabit") { e.preventDefault(); addHabit(e.target.value); }
  if (e.key === "Enter" && e.target.id === "ohnew") { e.preventDefault(); $('[data-act="ohadd"]').click(); }
  if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "gateForm") return; e.preventDefault();
  const g = S.gate; const name = $("#gname").value, pass = $("#gpass").value; g.name = name;
  try {
    let acct;
    if (g.mode === "create") { if (pass !== ($("#gpass2").value)) throw new Error("Passcodes don't match."); acct = await Accounts.create(name, pass); }
    else acct = await Accounts.signIn(name, pass);
    ls.set("gm:session", { id: acct.id }); await startLocal(acct);
  } catch (err) { g.err = err.message || "Something went wrong."; render(); }
});
window.addEventListener("pagehide", () => { if (Store.dirty.size) Store.flush(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && Store.dirty.size) Store.flush(); });

/* ============================ boot ============================ */
async function startLocal(acct){
  Store.mode = "local"; Store.uid = acct.id; Store.accountName = acct.name; S.gate = null;
  await Store.loadAll(); Duo.start(); render(); routeHash(); updateBadge();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
}
function showGate(){ const accts = Accounts.list(); S.gate = { mode: accts.length ? "signin" : "create", name: accts.length === 1 ? accts[0].name : "", err: "" }; render(); }
async function bootLocal(){
  const sess = ls.get("gm:session"); const acct = sess && Accounts.list().find(a => a.id === sess.id);
  if (acct) await startLocal(acct); else showGate();
}
window.addEventListener("hashchange", routeHash);
async function boot(){
  Theme.apply();
  if (!(window.claude && typeof window.claude.use === "function")) return bootLocal();
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    User = user; const id = user ? await user.id() : null;
    if (!db || !id) return bootLocal();
    Store.mode = "cloud"; Store.db = db; Store.uid = id; Store.col = db.collection("data/users/" + id);
    try { const me = await user.me(); Store.accountName = (me && me.name) || ""; } catch {}
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000));
    await Promise.race([Store.loadAll(), timeout]);
    Duo.start(); render(); routeHash();
  } catch (e) {
    $("#root").innerHTML = `<div class="gate"><div class="gate-card"><div class="gate-brand">Greatest<b>Me</b></div><p>Your journal didn't load. Check your connection, then reopen this page.</p><button class="btn" id="useLocal">Use an on-device journal instead</button></div></div>`;
    $("#useLocal").onclick = () => bootLocal();
  }
}
boot();
})();
</script>
