name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  journeys:
    name: Real-user journeys (must pass to deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Build and run journeys
        run: |
          ./build.sh
          node tests/journeys.js
  build:
    needs: journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build standalone page
        run: |
          ./build.sh
          mkdir -p _site
          cp index.html config.js sw.js _site/ && cp -r icons themes _site/
          cp -r vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
